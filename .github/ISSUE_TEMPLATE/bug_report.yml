name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `streamer --version`, or the app version.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Android, iOS]
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Media server and speaker
      description: Make and model of the DLNA/UPnP server and renderer involved, if relevant.
