[tools]
rust = { version = "1.97", components = "rustfmt,clippy" }

[tasks.build]
description = "Build all crates"
run = "cargo build --workspace"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.deny]
description = "Check licenses, advisories and sources (needs cargo-deny)"
run = "cargo deny check"

[tasks.check]
description = "Format check, lint and tests (what CI runs)"
depends = ["fmt", "lint", "test"]

[tasks.cli]
description = "Run the CLI"
run = "cargo run -p cacofone-streamer-cli --"

[tasks.tui]
description = "Run the TUI"
run = "cargo run -p cacofone-streamer-tui --"
