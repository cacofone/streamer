[tools]
rust = { version = "1.97", components = "rustfmt,clippy" }

[tasks.build]
description = "Build all crates"
run = "cargo build --workspace"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.deny]
description = "Check licenses, advisories and sources (needs cargo-deny)"
run = "cargo deny check"

[tasks.check]
description = "Format check, lint and tests (what CI runs)"
depends = ["fmt", "lint", "test"]

[tasks.cli]
description = "Run the CLI"
run = "cargo run -p cacofone-streamer-cli --"

[tasks.tui]
description = "Run the TUI"
run = "cargo run -p cacofone-streamer-tui --"

# Local install and test scripts. macOS and Linux run the .sh scripts, Windows the .bat scripts.
# Pass options after `--`, for example: mise run install-cli -- --prefix /opt/streamer

[tasks.install-cli]
description = "Build and install the CLI locally"
run = "bash crates/cli/bin/install.sh"
run_windows = "crates\\cli\\bin\\install.bat"

[tasks.uninstall-cli]
description = "Remove the locally installed CLI"
run = "bash crates/cli/bin/uninstall.sh"
run_windows = "crates\\cli\\bin\\uninstall.bat"

[tasks.test-cli]
description = "Test the CLI and smoke-test its binary"
run = "bash crates/cli/bin/test.sh"
run_windows = "crates\\cli\\bin\\test.bat"

[tasks.install-tui]
description = "Build and install the TUI locally"
run = "bash crates/tui/bin/install.sh"
run_windows = "crates\\tui\\bin\\install.bat"

[tasks.uninstall-tui]
description = "Remove the locally installed TUI"
run = "bash crates/tui/bin/uninstall.sh"
run_windows = "crates\\tui\\bin\\uninstall.bat"

[tasks.test-tui]
description = "Test the TUI and smoke-test its binary"
run = "bash crates/tui/bin/test.sh"
run_windows = "crates\\tui\\bin\\test.bat"

[tasks.test-core]
description = "Test the core library"
run = "bash crates/core/bin/test.sh"
run_windows = "crates\\core\\bin\\test.bat"
