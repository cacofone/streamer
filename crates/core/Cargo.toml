[package]
name = "cacofone-streamer-core"
description = "Shared core of Cacofone Streamer: DLNA/UPnP discovery, library browsing and playback control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "streamer_core"

[dependencies]
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net"] }
tracing = "0.1.44"
url = "2.5.9"

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
