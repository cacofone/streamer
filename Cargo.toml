[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/cacofone/streamer"
homepage = "https://cacofone.com/streamer/"

[workspace.dependencies]
cacofone-streamer-core = { version = "0.1.0", path = "crates/core" }
